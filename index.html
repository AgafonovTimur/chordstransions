<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Переходы аккордов</title>
<style>

:root{
  --ink:#3a3128;
  --paper:#f7f4ef;
  --track:#ded7cd;
  --red:rgba(255,48,48,.855);
  --yellow:rgba(255,221,87,.855);
  --cyan:rgba(91,225,229,.855);
  --red-solid:#ff4e4e;
  --yellow-solid:#ffe26f;
  --cyan-solid:#73e5e9;
  --tick:#a89f95;
  --hover:#ece6df;
  --picker-bg:rgba(246,243,239,.97);
  --serif:'Label Serif', 'EB Garamond', Garamond, 'Times New Roman', serif;
  --slab:'Title Slab', 'Roboto Slab', Rockwell, Georgia, serif;
}
html[data-theme="dark"]{
  --ink:#c9c5c0;
  --paper:#26262b;
  --track:#35343a;
  --tick:#6e6b70;
  --hover:#313036;
  --picker-bg:rgba(30,29,33,.97);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  transition:background-color .2s ease, color .2s ease;
}
.stage{
  min-height:100%;
  padding:12px 20px 12px 12px;
}
.diagram{
  display:flex;
  justify-content:center;
  min-width:0;
}
#map{
  display:block;
  width:100%;
  height:auto;
  max-height:calc(100vh - 24px);
  overflow:visible;
  user-select:none;
  -webkit-user-select:none;
}
.panel{
  /* Позиция панели (left/top) выставляется из JS — смотрите константы
     PANEL_OFFSET_X / PANEL_OFFSET_Y в блоке скрипта внизу файла. */
  position:fixed;
  display:flex;
  flex-direction:column;
  gap:14px;
  background:var(--paper);
  padding:10px;
  border-radius:12px;
  z-index:5;
  opacity:1;
  pointer-events:auto;
  transition:opacity .15s ease;
  max-height:calc(100vh - 24px);
  overflow-y:auto;
}
.panel.hidden{
  opacity:0;
  pointer-events:none;
}
.seg{
  display:flex;
  gap:6px;
}
.seg button{
  flex:1 1 0;
  min-width:104px;
  font:500 18px/1 var(--serif);
  color:var(--ink);
  background:var(--paper);
  border:1.5px solid var(--ink);
  border-radius:999px;
  padding:9px 14px 10px;
  cursor:pointer;
  transition:background-color .15s, color .15s;
}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{
  background:var(--ink);
  color:var(--paper);
}
.seg button:focus-visible{
  outline:3px solid var(--cyan-solid);
  outline-offset:2px;
}

/* ---- SVG ---- */
.track-base{fill:none;stroke:var(--track);stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.track-ticks{fill:none;stroke:var(--tick);stroke-width:5;stroke-dasharray:1 13;opacity:.75}
.arrow{fill:none;stroke:var(--ink);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-family:var(--serif);font-size:16px;fill:var(--ink)}
.node-text{font-family:var(--serif);font-weight:500;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.loop-title{font-family:var(--slab);font-weight:700;font-size:40px;text-anchor:middle}
.loop-title .outer{fill:var(--ink);stroke:var(--ink);stroke-width:7;stroke-linejoin:round}
.loop-title .inner{stroke:var(--paper);stroke-width:1.6;stroke-linejoin:round}

/* Надпись с названием текущего лада над центральной плашкой */
.mode-indicator{font-family:var(--serif);font-size:13px;fill:var(--ink);opacity:.75;text-anchor:middle;pointer-events:none}

/* ---- Кнопки тональности и лада в панели настроек ---- */
.group-label{font:600 13px/1.2 var(--serif);color:var(--ink);opacity:.65;margin:2px 0 -6px 2px}
.seg.piano{display:grid;grid-template-columns:repeat(14,1fr);column-gap:4px;row-gap:8px}
.seg.piano button{flex:none;min-width:0;width:auto;height:42px;padding:0;font-size:13px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.seg.piano button.black-key{font-size:10.5px}
.seg.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.grid3 button{flex:none;width:100%;text-align:center}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
@media (max-width:760px){
  .stage{display:flex;flex-direction:column;align-items:stretch;min-height:0;padding:10px;gap:4px}
  .panel{position:static;order:-1;gap:8px;padding-top:0}
  .seg button{min-width:0;font-size:16px;padding:8px 10px 9px}
  #map{max-height:none}
}
</style>
</head>
<body>
<main class="stage">
  <div class="diagram">
    <svg id="map" viewBox="-40 -6 1015 926" xmlns="http://www.w3.org/2000/svg" role="img">
      <g id="layer-tracks"></g>
      <g id="layer-arrows"></g>
      <g id="layer-labels"></g>
      <g id="layer-titles"></g>
      <g id="layer-nodes"></g>
      <g id="center"></g>
    </svg>
  </div>
  <aside class="panel">
    <div class="seg" id="lang-seg">
      <button type="button" data-lang="ru"></button>
      <button type="button" data-lang="en"></button>
    </div>
    <div class="seg" id="show-seg">
      <button type="button" data-show="notes"></button>
      <button type="button" data-show="degrees"></button>
    </div>
    <div class="seg" id="theme-seg">
      <button type="button" data-thm="dark"></button>
      <button type="button" data-thm="light"></button>
    </div>
    <div class="group-label" id="keyGroupLabel"></div>
    <div class="seg piano" id="key-seg"></div>
    <div class="group-label" id="modeGroupLabel"></div>
    <div class="seg grid3" id="mode-seg"></div>
  </aside>
</main>

<script>
(function(){
'use strict';

/* ================== Текст интерфейса ================== */
var UI = {
  ru:{ru:'Русский',en:'Английский',notes:'Ноты',degrees:'Ступени',
      light:'Светлая',dark:'Тёмная',
      title:'Переходы аккордов',
      langGroup:'Язык',showGroup:'Что показывать',themeGroup:'Тема',
      keyGroup:'Тональность',modeGroup:'Лад',
      map:'Схема переходов между аккордами тональности'},
  en:{ru:'Russian',en:'English',notes:'Notes',degrees:'Degrees',
      light:'Light',dark:'Dark',
      title:'Chord transitions',
      langGroup:'Language',showGroup:'What to show',themeGroup:'Theme',
      keyGroup:'Key',modeGroup:'Mode',
      map:'Map of transitions between the chords of a key'}
};
/* Названия кнопок языка — всегда на своём языке, независимо от выбранного интерфейса */
var LANG_NATIVE = { ru:'Русский', en:'English' };

/* ================== Теория ================== */
var KEYS = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
var LETTERS = 'CDEFGAB';
var NAT = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};

/* ---- Список ладов ----------------------------------------------------
   Чтобы добавить свой лад — впишите новую строку по тому же образцу:
   id — короткое имя без пробелов (используется в коде и в MOOD_OVERRIDE),
   ru/en — название лада, которое видит пользователь,
   steps — 7 чисел: расстояние в полутонах от тоники до каждой ступени
           лада (0 = тоника). Ровно как в старой переменной STEPS,
           только теперь для каждого лада своя. */
var MODE_LIST = [
  {id:'lydian',         ru:'Лидийский',            en:'Lydian',          steps:[0,2,4,6,7,9,11]},
  {id:'major',          ru:'Мажор',                en:'Major',           steps:[0,2,4,5,7,9,11]},
  {id:'mixolydian',     ru:'Миксолидийский',       en:'Mixolydian',      steps:[0,2,4,5,7,9,10]},
  {id:'dorian',         ru:'Дорийский',            en:'Dorian',          steps:[0,2,3,5,7,9,10]},
  {id:'natural_minor',  ru:'Минор',                en:'Minor',           steps:[0,2,3,5,7,8,10]},
  {id:'phrygian',       ru:'Фригийский',           en:'Phrygian',        steps:[0,1,3,5,7,8,10]},
  {id:'locrian',        ru:'Локрийский',           en:'Locrian',         steps:[0,1,3,5,6,8,10]},
  {id:'harmonic_minor', ru:'Гармонический минор',  en:'Harmonic minor',  steps:[0,2,3,5,7,8,11]},
  {id:'melodic_minor',  ru:'Мелодический минор',   en:'Melodic minor',   steps:[0,2,3,5,7,9,11]}
];
var MODE_BY_ID = {};
MODE_LIST.forEach(function(m){ MODE_BY_ID[m.id]=m; });

function currentMode(){ return MODE_BY_ID[state.mode]; }
function currentSteps(){ return currentMode().steps; }

/* scaleOf(key, steps) — ноты лада от заданной тоники.
   steps теперь передаётся аргументом (раньше было зашито под мажор). */
function scaleOf(key, steps){
  var L = key[0], a = key.slice(1);
  var acc = a==='#'?1 : a==='b'?-1 : 0;
  var root = (NAT[L]+acc+12)%12;
  var li = LETTERS.indexOf(L);
  return steps.map(function(s,i){
    var letter = LETTERS[(li+i)%7];
    var diff = (((root+s)%12 - NAT[letter])%12+12)%12;
    if(diff>6) diff -= 12;
    var sign = diff===1?'#':diff===2?'##':diff===-1?'b':diff===-2?'bb':'';
    return letter+sign;
  });
}

/* degreeQuality(steps, d) — определяет качество трезвучия на ступени d
   (0..6) для лада с заданными полутоновыми расстояниями steps.
   Раньше качество было прописано вручную только для мажора (QUAL),
   теперь оно считается по интервалам, поэтому работает для любого лада
   без ручных таблиц: '' — мажорное, 'm' — минорное, '°' — уменьшённое,
   '+' — увеличенное. */
function degreeQuality(steps, d){
  var r = steps[d%7];
  var third = ((steps[(d+2)%7]-r)+12)%12;
  var fifth = ((steps[(d+4)%7]-r)+12)%12;
  if(third===4 && fifth===7) return '';
  if(third===3 && fifth===7) return 'm';
  if(third===3 && fifth===6) return '\u00b0';
  if(third===4 && fifth===8) return '+';
  return ''; /* защитный вариант — для ладов из списка выше не срабатывает */
}

var ROMAN_BASE = ['I','II','III','IV','V','VI','VII'];
function romanFor(d, q){
  var base = ROMAN_BASE[d];
  if(q==='m') return base.toLowerCase();
  if(q==='\u00b0') return base.toLowerCase()+'\u00b0';
  if(q==='+') return base+'+';
  return base;
}

/* ================== Схема ==================
   deg: ступени (0 = I … 6 = vii°) по порядку обхода петли, от центра и обратно.
   pts: координаты узлов; way: промежуточные точки изгиба дорожки (после узла с этим номером).
   fwd: подписи для движения по петле «вперёд» (стрелка снаружи петли),
   rev: подписи для движения «назад» (стрелка внутри петли). */
var C0 = [470,462];
var LOOPS = [
  { color:'red', title:{ru:'Терции',en:'3rds'}, titleAt:[300,44],
    deg:[0,2,4,6,1,3,5,0],
    pts:[C0,[379,343],[370,219],[404,101],[532,101],[564,220],[556,344],C0],
    way:{0:[[418,440]],3:[[466,58]],6:[[522,440]]},
    t0:[-1,-0.12], t1:[-1,0.12],
    fwd:{
      en:['Loneliness','Strength,\nHappy surprise','Thickening,\nAdded tension','Negative surprise','Help, sweetness,\nMagnificence','Hardship','Pure positive'],
      ru:['Одиночество','Сила,\nрадостный сюрприз','Сгущение,\nрост напряжения','Неприятный сюрприз','Помощь, нежность,\nвеличие','Тяготы','Чистый позитив']},
    rev:{
      en:['Soft\nreturn','Bad news,\nLeft hanging','Release','Uncertainty','Darkening','Redemption,\nSupport','Pure\nnegative'],
      ru:['Мягкое\nвозвращение','Плохие новости,\nнедосказанность','Разрядка','Сомнение','Помрачнение','Искупление,\nподдержка','Чистый\nнегатив']}
  },
  { color:'yellow', title:{ru:'Кварты',en:'4ths'}, titleAt:[170,848],
    deg:[0,3,6,2,5,1,4,0],
    pts:[C0,[328,459],[220,525],[143,630],[183,737],[322,692],[410,607],C0],
    way:{0:[[418,448]],3:[[132,690]],6:[[462,528]]},
    t0:[-1,-0.12], t1:[0,-1],
    fwd:{
      en:['Exploration,\nWarmth','Drama,\nTension,\nAlarm','Despair,\nAnger','Sad resolution,\nAcceptance','Hope,\nOpening up','Happy\nclarification','Bright\nresolution'],
      ru:['Исследование,\nтеплота','Драма,\nнапряжение,\nтревога','Отчаяние,\nгнев','Грустное\nразрешение,\nпринятие','Надежда,\nраскрытие','Радостное\nпрояснение','Светлое\nразрешение']},
    rev:{
      en:['Bright peace','Mystery,\nMagic','Unknown,\nComplexity','Gravitas,\nEpicness','Closedness,\nShyness','Setback','Optimism\nEnergy'],
      ru:['Светлый\nпокой','Тайна,\nволшебство','Неизвестность,\nсложность','Весомость,\nэпичность','Замкнутость,\nробость','Шаг назад','Оптимизм,\nэнергия']}
  },
  { color:'cyan', title:{ru:'Секунды',en:'2nds'}, titleAt:[790,852],
    deg:[0,1,2,3,4,5,6,0],
    pts:[C0,[617,459],[727,528],[798,639],[746,737],[625,693],[523,610],C0],
    way:{0:[[522,448]],3:[[805,688]],6:[[476,530]]},
    t0:[1,-0.12], t1:[0,-1],
    fwd:{
      en:['Resignation','Heightened\ndramatic intensity','Overcoming,\nSolace','Heightened\njoy','Disappointment','Pain,\nconfusion',''],
      ru:['Смирение','Нарастание\nдраматизма','Преодоление,\nутешение','Нарастающая\nрадость','Разочарование','Боль,\nсмятение','']},
    rev:{
      en:['Clouded peace','Faltering','Loss,\nFragility','Calm','Positive\ntransformation','Dark resolution','Destabi-\nlisation'],
      ru:['Омрачённый\nпокой','Колебание','Утрата,\nхрупкость','Спокойствие','Позитивная\nперемена','Тёмное\nразрешение','Дестаби-\nлизация']}
  }
];

/* ================== Настроения для ЛАДА «Мажор» ==================
   Уже прописаны выше, в LOOPS[...].fwd / LOOPS[...].rev — их и меняйте,
   если нужно поправить настроение для мажора. Ничего не переносилось. */

/* ================== Настроения для остальных ладов ==================
   Настроения из «Мажор» подставляются в другой лад ТОЛЬКО там, где
   аккорды (буква + качество, например «Am» или «B°») у этого лада на
   тех же двух ступенях буквально совпадают с мажорными — то есть это
   реально тот же самый переход между теми же аккордами, что и в
   мажоре, просто повторяющийся в другом ладу. Если хотя бы один из
   двух аккордов другой (другой знак или другое качество) — переход
   считается новым, и вместо настроения показывается техническая
   подпись-заготовка вида «C Dorian 3rd Dm->Fm» (тоника/лад/круг/ноты),
   пока вы не впишете туда своё настроение вручную.

   Список того, где совпадения найдены (посчитано один раз заранее,
   ничего пересчитывать не нужно) — ниже, в MOOD_MATCHES. Чтобы
   вписать своё настроение вместо технической подписи — правьте
   MOOD_OVERRIDE, как раньше:

     MOOD_OVERRIDE['id_лада'][номер_круга]['f' или 'r'][язык][номер_стрелки]

   - id_лада — один из: lydian, mixolydian, dorian, natural_minor,
               phrygian, locrian, harmonic_minor, melodic_minor
   - номер_круга — 0 = Терции/3rds, 1 = Кварты/4ths, 2 = Секунды/2nds
   - 'f' — стрелка идёт по кругу «вперёд» (снаружи), 'r' — «назад» (внутри)
   - язык — 'ru' или 'en'
   - номер_стрелки — 0..6, какая по счёту стрелка в круге считая от центра:

       Круг 0 (Терции/3rds):   0: I->III  1: III->V   2: V->VII
                                3: VII->II 4: II->IV   5: IV->VI  6: VI->I
       Круг 1 (Кварты/4ths):   0: I->IV   1: IV->VII  2: VII->III
                                3: III->VI 4: VI->II   5: II->V   6: V->I
       Круг 2 (Секунды/2nds):  0: I->II   1: II->III  2: III->IV
                                3: IV->V   4: V->VI    5: VI->VII 6: VII->I

   Пример правки: MOOD_OVERRIDE.dorian[0].f.ru[0] = 'Моё настроение'; */
var EXTRA_MODE_IDS = ['lydian','mixolydian','dorian','natural_minor',
                       'phrygian','locrian','harmonic_minor','melodic_minor'];

/* MOOD_MATCHES — на каких стрелках (по кругам) аккорды лада буквально
   совпадают с мажорными (посчитано по формуле degreeQuality заранее).
   Формат: { номер_круга: [номера стрелок с совпадением] }. */
var MOOD_MATCHES = {
  lydian:         {0:[0,1,6], 1:[3,6], 2:[4]},
  mixolydian:     {0:[4,5,6], 1:[0,4], 2:[0]},
  dorian:         {0:[4]},
  natural_minor:  {},
  phrygian:       {},
  locrian:        {},
  harmonic_minor: {0:[2]},
  melodic_minor:  {0:[2,3,4], 1:[1,5], 2:[3]}
};

var MOOD_OVERRIDE = {};
EXTRA_MODE_IDS.forEach(function(id){
  MOOD_OVERRIDE[id] = [0,1,2].map(function(){
    return {
      f:{ru:['','','','','','',''], en:['','','','','','','']},
      r:{ru:['','','','','','',''], en:['','','','','','','']}
    };
  });
  var matches = MOOD_MATCHES[id] || {};
  Object.keys(matches).forEach(function(liStr){
    var li = +liStr, loop = LOOPS[li];
    matches[liStr].forEach(function(k){
      MOOD_OVERRIDE[id][li].f.ru[k] = loop.fwd.ru[k];
      MOOD_OVERRIDE[id][li].f.en[k] = loop.fwd.en[k];
      MOOD_OVERRIDE[id][li].r.ru[k] = loop.rev.ru[k];
      MOOD_OVERRIDE[id][li].r.en[k] = loop.rev.en[k];
    });
  });
});

/* moodText — возвращает подпись для стрелки: для «Мажор» берёт готовый
   текст из LOOPS, для остальных ладов — либо текст из MOOD_OVERRIDE
   (если вписан), либо автоматическую строку. */
function moodText(li, dirKey, k, lang){
  var loop = LOOPS[li];
  if(state.mode === 'major'){
    return (dirKey==='f' ? loop.fwd : loop.rev)[lang][k];
  }
  var ov = MOOD_OVERRIDE[state.mode][li][dirKey][lang][k];
  if(ov) return ov;
  var steps = currentSteps();
  var fromDeg = dirKey==='f' ? loop.deg[k]   : loop.deg[k+1];
  var toDeg   = dirKey==='f' ? loop.deg[k+1] : loop.deg[k];
  var sc = scaleOf(state.key, steps);
  var qFrom = degreeQuality(steps, fromDeg);
  var qTo   = degreeQuality(steps, toDeg);
  var modeName = currentMode()[lang];
  var loopName = loop.title[lang];
  return state.key+' '+modeName+' '+loopName+' '+sc[fromDeg]+qFrom+'->'+sc[toDeg]+qTo;
}

/* Положение подписей: 'петля:f|r:участок' -> [x, y, по горизонтали, по вертикали]
   по горизонтали: l — левый край блока в точке x, r — правый край, c — центр;
   по вертикали:   t — верх блока в точке y, b — низ, m — середина.
   LBL_RU — отдельные положения для русского там, где длинный текст не помещается. */
var LBL = {
  '0:f:0':[363,376,'r','m'], '0:r:0':[425,371,'l','t'], /* C -> Em и C -> Am */
  '0:f:1':[340,281,'r','m'], '0:r:1':[393,297,'l','m'],
  '0:f:2':[350,144,'r','m'], '0:r:2':[405,184,'l','m'],
  '0:f:3':[465,30,'c','b'],  '0:r:3':[463,102,'c','m'],
  '0:f:4':[580,159,'l','m'], '0:r:4':[530,155,'r','m'],
  '0:f:5':[597,289,'l','m'], '0:r:5':[550,257,'r','m'],
  '0:f:6':[570,387,'l','m'], '0:r:6':[517,362,'r','m'],

  '1:f:0':[370,419,'r','m'], '1:r:0':[392,475,'c','t'],
  '1:f:1':[259,453,'r','m'], '1:r:1':[257,527,'l','m'],
  '1:f:2':[163,555,'r','m'], '1:r:2':[197,603,'l','m'],

var LBL_RU = {

  '1:r:0':[388,475,'c','t'],
  '1:r:4':[265,687,'c','b'],
  '1:f:6':[464,607,'c','t'],
  '2:f:1':[712,466,'l','m'],
  '2:r:0':[550,475,'c','t'],
  '2:r:3':[797,694,'r','m'],
  '2:r:4':[694,660,'c','m']
};
/* В режиме «ступень – нота» узлы шире, часть подписей отодвигается */
var LBL_WIDE = {
  '0:r:2':[410,196,'l','m'],
  '0:r:3':[466,129,'c','t'],
  '0:r:4':[530,172,'r','m'],
  '0:r:6':[514,362,'r','m'],

  '2:r:5':[576,612,'l','m']
};
var LBL_WIDE_RU = {
  '1:r:0':[388,475,'c','t']
};
/* Положение стрелок на участке между узлами (0 — у первого узла, 1 — у второго) */
var FRAC = {'0:0':0.68,'0:6':0.4,'1:0':0.62,'1:6':0.45,'2:0':0.5,'2:6':0.5};

/* ================== Состояние ================== */
var SAVED = loadSettings();
var state = {
  key: (SAVED && SAVED.key) || 'C',
  mode: (SAVED && SAVED.mode) || 'major',
  lang: (SAVED && SAVED.lang) || 'ru',
  notes: SAVED ? !!SAVED.notes : true,
  degrees: SAVED ? !!SAVED.degrees : false,
  theme: (SAVED && SAVED.theme) || 'dark'
};
document.documentElement.setAttribute('data-theme',state.theme);

/* ================== Сохранение настроек ================== */
var SETTINGS_KEY = 'chordTransitions.settings';
function loadSettings(){
  /* Сначала пробуем прочитать настройки из адреса страницы (после #) —
     это работает всегда, даже если браузер запрещает localStorage
     для файлов, открытых прямо с диска (file://). Если в адресе
     ничего нет — пробуем localStorage как запасной вариант. */
  try{
    if(location.hash && location.hash.length>1){
      return JSON.parse(decodeURIComponent(location.hash.slice(1)));
    }
  }catch(e){}
  try{
    var raw = localStorage.getItem(SETTINGS_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSettings(){
  var data = {
    key:state.key, mode:state.mode, lang:state.lang,
    notes:state.notes, degrees:state.degrees, theme:state.theme
  };
  try{
    history.replaceState(null, '', '#'+encodeURIComponent(JSON.stringify(data)));
  }catch(e){}
  try{
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(data));
  }catch(e){}
}

/* ---- Позиция панели настроек относительно центра схемы (в пикселях) ----
   Панель привязана не к краю экрана, а к центральной точке схемы (C0).
   Числа ниже — это расстояние в реальных экранных пикселях от центра
   до левого верхнего угла панели: OFFSET_X — вправо (отрицательное — влево),
   OFFSET_Y — вниз (отрицательное — вверх). При любом размере/масштабе
   окна панель останется на этом же расстоянии от центра схемы. */
var PANEL_OFFSET_X = 370;
var PANEL_OFFSET_Y = -390;

function updatePanelPosition(){
  if(!svg.getScreenCTM) return;
  var ctm = svg.getScreenCTM();
  if(!ctm) return;
  var pt = svg.createSVGPoint();
  pt.x = C0[0]; pt.y = C0[1];
  var s = pt.matrixTransform(ctm);
  panelEl.style.left = Math.round(s.x + PANEL_OFFSET_X) + 'px';
  panelEl.style.top  = Math.round(s.y + PANEL_OFFSET_Y) + 'px';
}

/* ================== Геометрия ================== */
var NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  var e = document.createElementNS(NS, tag);
  for(var k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function sub(a,b){return [a[0]-b[0],a[1]-b[1]]}
function add(a,b){return [a[0]+b[0],a[1]+b[1]]}
function mul(a,k){return [a[0]*k,a[1]*k]}
function len(a){return Math.hypot(a[0],a[1])}
function norm(a){var l=len(a)||1;return [a[0]/l,a[1]/l]}

/* Строит гладкую дорожку через точки (кубические кривые Катмулла-Рома) */
function buildLoop(loop){
  var P = [], isNode = [];
  loop.pts.forEach(function(p,i){
    P.push(p); isNode.push(true);
    (loop.way[i]||[]).forEach(function(w){ P.push(w); isNode.push(false); });
  });
  var n = P.length, T = [];
  for(var i=0;i<n;i++){
    if(i===0){ T.push(mul(norm(loop.t0), len(sub(P[1],P[0]))*1.0)); }
    else if(i===n-1){ T.push(mul(norm(loop.t1), len(sub(P[n-1],P[n-2]))*1.0)); }
    else{ T.push(mul(sub(P[i+1],P[i-1]),0.5)); }
  }
  var segs = [], d = 'M'+P[0][0]+','+P[0][1];
  for(var j=0;j<n-1;j++){
    var a=P[j], b=P[j+1];
    var c1=add(a,mul(T[j],1/3)), c2=sub(b,mul(T[j+1],1/3));
    segs.push([a,c1,c2,b]);
    d += ' C'+c1.map(f1)+' '+c2.map(f1)+' '+b.map(f1);
  }
  /* Выборка точек вдоль дорожки и отметки, где находятся узлы */
  var poly = [], nodeIdx = [0];
  segs.forEach(function(s,si){
    for(var k=(si===0?0:1);k<=40;k++){
      var t=k/40, u=1-t;
      var x=u*u*u*s[0][0]+3*u*u*t*s[1][0]+3*u*t*t*s[2][0]+t*t*t*s[3][0];
      var y=u*u*u*s[0][1]+3*u*u*t*s[1][1]+3*u*t*t*s[2][1]+t*t*t*s[3][1];
      poly.push([x,y]);
    }
    if(isNode[si+1]) nodeIdx.push(poly.length-1);
  });
  var cum=[0];
  for(var q=1;q<poly.length;q++) cum.push(cum[q-1]+len(sub(poly[q],poly[q-1])));
  /* Ориентация петли: какая сторона наружу */
  var area=0;
  for(var r=0;r<poly.length-1;r++) area += poly[r][0]*poly[r+1][1]-poly[r+1][0]*poly[r][1];
  return {d:d, poly:poly, cum:cum, nodeIdx:nodeIdx, sign: area>0?1:-1};
}
function f1(v){return Math.round(v*10)/10}

/* Точка и касательная на дорожке по расстоянию от начала */
function at(g, s){
  var c=g.cum, lo=0, hi=c.length-1;
  while(hi-lo>1){ var mid=(lo+hi)>>1; if(c[mid]<s) lo=mid; else hi=mid; }
  var seg=c[hi]-c[lo]||1, t=(s-c[lo])/seg;
  var p=add(g.poly[lo],mul(sub(g.poly[hi],g.poly[lo]),t));
  var tg=norm(sub(g.poly[hi],g.poly[lo]));
  return {p:p,t:tg};
}

var ARROW_OFF = 18, ARROW_LEN = 60, CLEAR = 30, LABEL_GAP = 7;

function arrowPath(g, s0, s1, side, forward){
  var pts=[], N=14;
  for(var i=0;i<=N;i++){
    var s = s0+(s1-s0)*i/N, a=at(g,s);
    var nrm=[a.t[1]*g.sign*side, -a.t[0]*g.sign*side];
    pts.push(add(a.p, mul(nrm, ARROW_OFF)));
  }
  if(!forward) pts.reverse();
  var d='M'+pts.map(function(p){return p.map(f1).join(',')}).join(' L');
  var end=pts[pts.length-1], dir=norm(sub(end,pts[pts.length-3]));
  var h=8, w=0.5;
  var back=mul(dir,-h), left=[back[0]*Math.cos(w)-back[1]*Math.sin(w), back[0]*Math.sin(w)+back[1]*Math.cos(w)];
  var right=[back[0]*Math.cos(-w)-back[1]*Math.sin(-w), back[0]*Math.sin(-w)+back[1]*Math.cos(-w)];
  d += ' M'+add(end,left).map(f1)+' L'+end.map(f1)+' L'+add(end,right).map(f1);
  return {d:d, mid:pts[Math.floor(pts.length/2)]};
}

/* ================== Отрисовка ================== */
var svg = document.getElementById('map');
var L = {
  tracks:document.getElementById('layer-tracks'),
  arrows:document.getElementById('layer-arrows'),
  labels:document.getElementById('layer-labels'),
  titles:document.getElementById('layer-titles'),
  nodes:document.getElementById('layer-nodes'),
  center:document.getElementById('center')
};
var GEO = LOOPS.map(buildLoop);

function drawStatic(){
  GEO.forEach(function(g){
    el('path',{d:g.d,'class':'track-base'},L.tracks);
  });
  /* стрелки */
  GEO.forEach(function(g,li){
    g.arrows=[];
    for(var k=0;k<g.nodeIdx.length-1;k++){
      var sA=g.cum[g.nodeIdx[k]], sB=g.cum[g.nodeIdx[k+1]];
      var fr=FRAC[li+':'+k]||0.5;
      var half=Math.min(ARROW_LEN,(sB-sA)-2*CLEAR)/2;
      var mid=Math.max(sA+CLEAR+half, Math.min(sB-CLEAR-half, sA+(sB-sA)*fr));
      var f=arrowPath(g,mid-half,mid+half, 1,true);
      var r=arrowPath(g,mid-half,mid+half,-1,false);
      el('path',{d:f.d,'class':'arrow'},L.arrows);
      el('path',{d:r.d,'class':'arrow'},L.arrows);
      var tg=at(g,mid).t;
      var out=[tg[1]*g.sign,-tg[0]*g.sign];
      g.arrows.push({f:f.mid, r:r.mid, out:out});
    }
  });
}

function placeLabel(text, key){
  var wide = wideNow;
  var spec = (wide && state.lang==='ru' && LBL_WIDE_RU[key]) || (wide && LBL_WIDE[key]) || (state.lang==='ru' && LBL_RU[key]) || LBL[key];
  if(!spec) return;
  var lines = text.split('\n');
  var t = el('text',{'class':'lbl','text-anchor':'middle'},L.labels);
  lines.forEach(function(line,i){
    var ts = el('tspan',{x:0,dy:i===0?'0':'1.08em'},t);
    ts.textContent=line;
  });
  var bb=t.getBBox();
  var x=spec[0], y=spec[1];
  var cx = spec[2]==='l' ? x+bb.width/2 : spec[2]==='r' ? x-bb.width/2 : x;
  var top = spec[3]==='t' ? y : spec[3]==='b' ? y-bb.height : y-bb.height/2;
  t.setAttribute('transform','translate('+f1(cx)+','+f1(top-bb.y)+')');
  return t;
}

function chordText(deg){
  var steps = currentSteps();
  var sc = scaleOf(state.key, steps);
  var q = degreeQuality(steps, deg);
  var name = sc[deg]+q;
  if(state.notes && state.degrees) return romanFor(deg,q)+' \u2013 '+name;
  if(state.degrees) return romanFor(deg,q);
  return name;
}

function pill(parent, cx, cy, text, fill, fontSize){
  var g = el('g',{},parent);
  var r = el('rect',{},g);
  var t = el('text',{x:cx,y:cy+1,'class':'node-text','font-size':fontSize},g);
  t.textContent = text;
  var w = t.getComputedTextLength ? t.getComputedTextLength() : text.length*fontSize*.5;
  var h = 46, W = Math.max(28, w+17);
  r.setAttribute('x',f1(cx-W/2)); r.setAttribute('y',cy-h/2);
  r.setAttribute('width',f1(W)); r.setAttribute('height',h);
  r.setAttribute('rx',Math.min(W,h)/2);
  r.setAttribute('fill',fill);
  return {g:g,w:W,h:h};
}

var COLORS = {red:'var(--track)',yellow:'var(--track)',cyan:'var(--track)'};

function nodeFont(){ return (state.notes && state.degrees) ? 20 : 31; }

var wideNow = false;
/* Узлы стали заметно шире обычных «Dm», «Em»? Тогда подписи рядом с ними отодвигаются. */
function measureWide(fs){
  if(state.notes && state.degrees) return true;
  var probe = el('text',{'class':'node-text','font-size':fs},L.nodes);
  probe.textContent='Dm';
  var base = probe.getComputedTextLength(), max = 0;
  for(var d=0; d<7; d++){
    probe.textContent = chordText(d);
    max = Math.max(max, probe.getComputedTextLength());
  }
  L.nodes.removeChild(probe);
  return max > base + 3;
}

function drawDynamic(){
  var lang = state.lang, fs = nodeFont();
  L.labels.textContent=''; L.titles.textContent=''; L.nodes.textContent=''; L.center.textContent='';
  wideNow = measureWide(fs);

  /* подписи переходов */
  GEO.forEach(function(g,li){
    var loop=LOOPS[li];
    g.arrows.forEach(function(a,k){
      var ft=moodText(li,'f',k,lang), rt=moodText(li,'r',k,lang);
      if(ft) placeLabel(ft, li+':f:'+k);
      if(rt) placeLabel(rt, li+':r:'+k);
    });
  });
  /* подпись «Bright resolution» общая для V → I и vii° → I, она хранится у петли кварт */

  /* названия петель */
  LOOPS.forEach(function(loop){
    var g = el('g',{'class':'loop-title',transform:'translate('+loop.titleAt+')'},L.titles);
    var o = el('text',{'class':'outer'},g); o.textContent=loop.title[lang];
    var i = el('text',{'class':'inner'},g); i.textContent=loop.title[lang];
  });

  /* узлы */
  LOOPS.forEach(function(loop){
    for(var k=1;k<loop.pts.length-1;k++){
      pill(L.nodes, loop.pts[k][0], loop.pts[k][1], chordText(loop.deg[k]), COLORS[loop.color], fs);
    }
  });

  /* центр */
  drawCenter(fs);
  applyUI();
}

function drawCenter(fs){
  var c=C0, g=L.center;
  var txt = chordText(0);
  var probe = el('text',{'class':'node-text','font-size':fs},g); probe.textContent=txt;
  var w = probe.getComputedTextLength(); g.removeChild(probe);
  var W = Math.max(32, w+16), H = 57;
  function rr(wd,ht,fill){ el('rect',{x:f1(c[0]-wd/2),y:f1(c[1]-ht/2),width:f1(wd),height:f1(ht),rx:f1(Math.min(wd,ht)/2),fill:fill},g); }
  rr(W,H,'var(--track)');
  var t=el('text',{x:c[0],y:c[1]+1,'class':'node-text','font-size':fs+6},g); t.textContent=txt;
}

/* ---- Кнопки тональности и лада в панели настроек (заменяют
   прежний круговой выбор нот и выпадающий список ладов по центру схемы) ---- */
function buildKeyModeButtons(){
  var KEY_LABELS = {Db:'C#/Db', Eb:'D#/Eb', 'F#':'F#/Gb', Ab:'G#/Ab', Bb:'A#/Bb'};
  /* Раскладка как на пианино: чёрные клавиши — верхний ряд, сдвинуты
     на стыки соседних белых; белые клавиши — нижний ряд, встык. */
  var PIANO_COLS = [
    {black:false, col:'1 / 3',  row:'2'},
    {black:true,  col:'2 / 4',  row:'1'},
    {black:false, col:'3 / 5',  row:'2'},
    {black:true,  col:'4 / 6',  row:'1'},
    {black:false, col:'5 / 7',  row:'2'},
    {black:false, col:'7 / 9',  row:'2'},
    {black:true,  col:'8 / 10', row:'1'},
    {black:false, col:'9 / 11', row:'2'},
    {black:true,  col:'10 / 12',row:'1'},
    {black:false, col:'11 / 13',row:'2'},
    {black:true,  col:'12 / 14',row:'1'},
    {black:false, col:'13 / 15',row:'2'}
  ];
  var keySeg = document.getElementById('key-seg');
  KEYS.forEach(function(k, i){
    var info = PIANO_COLS[i];
    var b = document.createElement('button');
    b.type='button'; b.dataset.key=k; b.textContent=KEY_LABELS[k]||k;
    b.style.gridColumn = info.col;
    b.style.gridRow = info.row;
    if(info.black) b.classList.add('black-key');
    keySeg.appendChild(b);
  });
  var modeSeg = document.getElementById('mode-seg');
  MODE_LIST.forEach(function(m){
    var b = document.createElement('button');
    b.type='button'; b.dataset.mode=m.id;
    modeSeg.appendChild(b);
  });
  keySeg.addEventListener('click', function(e){
    var b=e.target.closest('button[data-key]'); if(!b) return;
    if(state.key===b.dataset.key) return;
    state.key=b.dataset.key; saveSettings(); drawDynamic();
  });
  modeSeg.addEventListener('click', function(e){
    var b=e.target.closest('button[data-mode]'); if(!b) return;
    if(state.mode===b.dataset.mode) return;
    state.mode=b.dataset.mode; saveSettings(); drawDynamic();
  });
}

function applyUI(){
  var u=UI[state.lang];
  document.documentElement.lang=state.lang;
  document.title=u.title;
  svg.setAttribute('aria-label',u.map);
  document.getElementById('lang-seg').setAttribute('aria-label',u.langGroup);
  document.getElementById('show-seg').setAttribute('aria-label',u.showGroup);
  document.getElementById('theme-seg').setAttribute('aria-label',u.themeGroup);
  document.querySelectorAll('[data-lang]').forEach(function(b){
    b.textContent=LANG_NATIVE[b.dataset.lang];
    b.setAttribute('aria-pressed',b.dataset.lang===state.lang?'true':'false');
  });
  document.querySelectorAll('[data-show]').forEach(function(b){
    b.textContent=u[b.dataset.show];
    b.setAttribute('aria-pressed',state[b.dataset.show]?'true':'false');
  });
  document.querySelectorAll('[data-thm]').forEach(function(b){
    b.textContent=u[b.dataset.thm];
    b.setAttribute('aria-pressed',b.dataset.thm===state.theme?'true':'false');
  });
  document.getElementById('keyGroupLabel').textContent=u.keyGroup;
  document.getElementById('modeGroupLabel').textContent=u.modeGroup;
  document.getElementById('key-seg').setAttribute('aria-label',u.keyGroup);
  document.getElementById('mode-seg').setAttribute('aria-label',u.modeGroup);
  document.querySelectorAll('#key-seg [data-key]').forEach(function(b){
    b.setAttribute('aria-pressed',b.dataset.key===state.key?'true':'false');
  });
  document.querySelectorAll('#mode-seg [data-mode]').forEach(function(b){
    var m = MODE_BY_ID[b.dataset.mode];
    b.textContent = m[state.lang];
    b.setAttribute('aria-pressed',b.dataset.mode===state.mode?'true':'false');
  });
}

/* ================== Управление ================== */
buildKeyModeButtons();

document.querySelectorAll('[data-lang]').forEach(function(b){
  b.addEventListener('click',function(){
    if(state.lang===b.dataset.lang) return;
    state.lang=b.dataset.lang; saveSettings(); drawDynamic();
  });
});
document.querySelectorAll('[data-show]').forEach(function(b){
  b.addEventListener('click',function(){
    var k=b.dataset.show, other=k==='notes'?'degrees':'notes';
    if(state[k] && !state[other]) return; // хотя бы одна кнопка всегда включена
    state[k]=!state[k]; saveSettings(); drawDynamic();
  });
});
document.querySelectorAll('[data-thm]').forEach(function(b){
  b.addEventListener('click',function(){
    if(state.theme===b.dataset.thm) return;
    state.theme=b.dataset.thm;
    document.documentElement.setAttribute('data-theme',state.theme);
    saveSettings();
    applyUI();
  });
});


/* ---- Показ / скрытие панели настроек ----
   Переключается средней кнопкой мыши (колесо) и клавишей Y/Н. */
var panelEl = document.querySelector('.panel');
function togglePanel(){ panelEl.classList.toggle('hidden'); }
document.addEventListener('auxclick', function(e){
  if(e.button===1){ e.preventDefault(); togglePanel(); }
});
document.addEventListener('mousedown', function(e){
  if(e.button===1){ e.preventDefault(); }
});
document.addEventListener('keydown', function(e){
  if(e.code==='KeyY'){ togglePanel(); }
});

function start(){ drawStatic(); drawDynamic(); updatePanelPosition(); }
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(start); } else { start(); }

window.addEventListener('resize', updatePanelPosition);
window.addEventListener('orientationchange', updatePanelPosition);
if(window.ResizeObserver){
  new ResizeObserver(updatePanelPosition).observe(svg);
}
})();
